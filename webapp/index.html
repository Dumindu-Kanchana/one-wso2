<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Scheme-aware favicon: the square pulse mark on its own, in black or
         white. A favicon slot is ~16px and square, so it takes the symbol only
         — never the wordmark lockup, which is 2.5:1 and would render as a
         16x6px smudge. The mark's viewBox is trimmed to its own bounds so it
         fills the slot instead of sitting inside 25% transparent padding.

         Monochrome per https://wso2.com/about/brand: black on light, white on
         dark. A single orange mark was wrong on the light tab strip most
         browsers show by default, since orange is approved on dark only.

         Dark is declared first deliberately: a browser that ignores `media` on
         an icon link generally takes the last one, and the black mark is the
         safer default against a light tab strip. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon-white.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon-black.svg"
      media="(prefers-color-scheme: light)"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Limit referrer leakage across origins. (Content-Security-Policy is
         injected on production builds only — see vite.config.ts — so it
         doesn't interfere with the dev server's inline scripts / HMR.) -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>One WSO2</title>
    <!-- Runtime config injected at deploy time. See public/config.js.example. -->
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
